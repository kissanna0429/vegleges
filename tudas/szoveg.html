<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!--1es szintu cimsor-->
    <h1>Ez egy nagy cím</h1>

    <!--2es szintu cimsor-->
    <h2>ez egy kisebb cim</h2>

    <!--3es szintu cimsor-->
    <h3>ez egy kis cim</h3>

    <!--h4...h5...-->

    <!--egyszeru szoveg-->
    <p>ez egy egyszeru szoveg</p>

    <style>
      .modositott {
        color: blue;
        text-decoration: underline; /*dekoralas alahuzassal*/
        text-transform: uppercase; /*atalakitas nagybetusse*/
        font-weight: 600; /*vastagsag, 400-sima, 600-felkover*/
        font-size: 0.75rem;
      }
    </style>

    <p class="modositott">ezen a szovegen egy csomo mindent beallitottunk</p>

    <style>
      .szulo {
        color: green;
        font-weight: 200;
      }
    </style>

    <div class="szulo">
      <p>egyik gyerek</p>
      <p>masik gyerek</p>
      <p>harmadik gyerek</p>
    </div>
  </body>
</html>
